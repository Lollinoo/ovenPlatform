services:
  # Backend Service
  oven-backend-prod:
    build:
      context: ../ovenPlatform-be
      dockerfile: Dockerfile.prod
    image: oven-backend-prod:1.3.0
    container_name: oven-backend-prod
    restart: unless-stopped
    ports:
      - "4172:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ../ovenPlatform-be/.env
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/v1/ome/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s
    networks:
      - oven-network

  # Frontend Service
  oven-frontend-prod:
    build:
      context: ../ovenPlatform-web
      dockerfile: Dockerfile.prod
      args:
        - NODE_ENV=production
    image: oven-frontend-prod:1.3.0
    container_name: oven-frontend-prod
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
    env_file:
      - ../ovenPlatform-web/.env
    depends_on:
      - oven-backend-prod
        # condition: service_healthy
    networks:
      - oven-network

  # Proxy Service (Nginx)
  # oven-proxy:
  #   image: nginx:1.25-alpine
  #   container_name: oven-proxy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #     - ./nginx/certs:/etc/nginx/certs:ro
  #     - ./nginx/logs:/var/log/nginx
  #   depends_on:
  #     - oven-frontend
  #     - oven-backend
  #   networks:
  #     - oven-network

networks:
  oven-network:
    name: oven-network
    driver: bridge

