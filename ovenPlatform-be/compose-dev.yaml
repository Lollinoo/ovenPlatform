services:
  oven-backend:
    image: oven-backend-dev:1.1.3
    container_name: oven-backend-dev
    ports:
      - "3001:3000"
    volumes:
      - ./:/app
      - /app/node_modules # Volume anonimo per preservare node_modules
    restart: unless-stopped
    networks:
      - ovendevelop-net

networks:
  ovendevelop-net:
    external: true
